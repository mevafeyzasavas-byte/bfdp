plugins {
    id 'com.android.application'
}

android {
    namespace 'com.norhan.beslenme'
    compileSdk 34

    defaultConfig {
        applicationId "com.norhan.beslenme"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // İmzasız (unsigned) release APK üretir; debug APK doğrudan kurulabilir.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
