name: Build APK

# ONEMLI: Bu is akisi SADECE "app/" klasorundeki Android kodu degisince calisir.
# index.html'i gh-pages / docs klasorunde guncelledikinizde bu build TETIKLENMEZ,
# cunku uygulama zaten sayfayi internetten canli cekiyor. Yani her icerik
# guncellemesinde APK'yi yeniden derlemeniz gerekmez.
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: beslenme-ders-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: GitHub Release olustur ve APK ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Otomatik Derleme #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
